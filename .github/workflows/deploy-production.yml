# Push to main deploys MarketingOS on the AWS VPS.
#
# GitHub-hosted runners cannot SSH to the VPS: the security group blocks
# inbound TCP 22, so an ubuntu-latest job never reaches the host. This job
# runs on the self-hosted runner installed on that VPS and executes
# /home/ubuntu/apps/marketingos/scripts/deploy.sh locally. There is no
# outbound SSH.
#
# The GitHub-hosted SSH path is retired. MARKETINGOS_DEPLOY_HOST,
# MARKETINGOS_DEPLOY_USER, MARKETINGOS_DEPLOY_SSH_KEY, and
# MARKETINGOS_DEPLOY_KNOWN_HOSTS are not used. An admin can still deploy by
# SSHing to the VPS and running the same script.

name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: marketingos-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS VPS
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 40
    steps:
      - name: Run local deploy script
        timeout-minutes: 35
        run: |
          set -euo pipefail
          script="/home/ubuntu/apps/marketingos/scripts/deploy.sh"
          if [[ ! -f "${script}" ]]; then
            echo "FAIL: ${script} is missing. This job must run on the MarketingOS VPS runner (labels: self-hosted, linux, aws, marketingos)."
            exit 1
          fi
          bash "${script}"
          echo "Production deploy script finished on the VPS. Local health passed inside scripts/deploy.sh."

      - name: Check public health
        run: |
          set -euo pipefail
          url="https://marketing-aws.gorillaworkout.id/api/health"
          sleep 3
          attempt=1
          http_code="000"
          while [[ "$attempt" -le 6 ]]; do
            http_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${url}" || true)"
            if [[ -z "${http_code}" ]]; then
              http_code="000"
            fi
            echo "public health attempt ${attempt}/6: HTTP ${http_code}"
            if [[ "${http_code}" == "200" ]]; then
              echo "SUCCESS: ${url} returned 200"
              exit 0
            fi
            attempt=$((attempt + 1))
            if [[ "$attempt" -le 6 ]]; then
              sleep 5
            fi
          done
          echo "FAIL: ${url} did not return 200 (last HTTP ${http_code}). The VPS deploy script already finished."
          exit 1
